<style>
:root{--bg:#f2f2f7;--card:#fff;--tx:#111;--mu:#8a8a8e;--ac:#0f766e;--onac:#fff;--in:#2e9e57;--out:#e5383b;--bd:rgba(60,60,67,.14);--fill:rgba(118,118,128,.12);--bar:rgba(249,249,251,.86);--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%}

main{max-width:520px;margin:0 auto;padding:6px 16px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.top{display:flex;align-items:center;gap:8px;padding:6px 0 10px}
.dd{font-weight:600}.sp{flex:1}
.ib{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--ac);flex:none;position:relative}

.ib.q{position:absolute;right:0;top:0}
.bdg{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--out)}
.mnr{position:relative}
.mn{display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.mn b{min-width:130px;text-align:center;font-weight:600}
.mn button{width:34px;height:34px;display:grid;place-items:center;color:var(--ac)}
.hero{padding:6px 4px 16px}
.hero small{display:block;color:var(--mu);font-size:13px}
.hero .big{font-size:48px;font-weight:700;letter-spacing:-1.5px;line-height:1.15;font-variant-numeric:tabular-nums}
.hero .big.neg{color:var(--out)}
.two,.three{display:grid;gap:10px}
.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}
.two>div,.three>div{background:var(--card);border-radius:16px;padding:12px 14px}

.dot{width:8px;height:8px;border-radius:50%;margin-inline-end:6px}

.row{display:flex;align-items:center;gap:12px;padding:11px 14px;width:100%;text-align:start}

.nt{margin-inline-start:4px}
.amt{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.amt.out{color:inherit}.amt.in{color:var(--in)}
.card2{background:var(--card);border-radius:12px;margin-bottom:10px}
.empty{text-align:center;color:var(--mu);padding:44px 10px}
.rng{text-align:center;color:var(--mu);font-size:13px;margin:2px 0 10px}

@keyframes up{from{transform:translateY(60px);opacity:0}}

.sh{display:flex;align-items:center;justify-content:space-between;font-size:20px;font-weight:700;margin:0 2px 12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--fill);border-radius:10px;padding:2px;margin-bottom:12px}
.seg button{padding:7px;border-radius:8px;font-weight:600;font-size:14px;color:var(--mu)}
.seg button.on{background:var(--on);color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.btn{display:block;width:100%;height:50px;line-height:50px;border-radius:14px;background:var(--ac);color:var(--onac);font-weight:600;margin-top:10px;text-align:center}
.btn.alt{background:var(--fill);color:var(--tx)}.btn.del{background:none;color:var(--out)}
input,textarea,select{width:100%;font:inherit;color:var(--tx);background:var(--card);border:0;border-radius:12px;padding:13px 14px;margin-bottom:10px;-webkit-appearance:none;appearance:none}
input:focus,textarea:focus,select:focus{outline:2px solid var(--ac)}
input.amount{font-size:34px;font-weight:700;text-align:center;padding:14px}
.sw{width:51px;height:31px;padding:0;margin:0;border-radius:16px;background:rgba(120,120,128,.32);position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:.2s}
.sw:checked{background:#34c759}.sw:checked::after{transform:translateX(20px)}
.lb{display:block;color:var(--mu);font-size:13px;margin:4px 4px}
.dsel{display:grid;grid-template-columns:.8fr 1.4fr 1fr;gap:8px;margin-bottom:6px}
.dsel select{margin:0;padding:12px 4px;text-align:center;text-align-last:center}
.wdl{text-align:center;color:var(--mu);font-size:13px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chips button{padding:7px 14px;border-radius:18px;background:var(--fill);font-size:14.5px}
.chips button.on{background:var(--ac);color:var(--onac)}
.chips button.add{background:none;border:1.5px dashed var(--mu);color:var(--mu);padding:5px 12px}
.sc{flex-wrap:nowrap;overflow-x:auto;margin:4px -16px 12px;padding:0 16px}.sc button{white-space:nowrap;flex:none}
.cr{display:grid;grid-template-columns:64px 1fr;gap:8px}
.cr input:first-child{text-align:center;font-size:22px}
.ems{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.ems button{width:40px;height:40px;border-radius:12px;background:var(--fill);font-size:20px}
.ems button.on{outline:2px solid var(--ac)}
.pie{display:flex;flex-direction:column;align-items:center;gap:10px}.pie svg{width:170px;height:170px}
.lg{width:100%}.lg div{display:flex;align-items:center;gap:8px;padding:5px 2px}
.lg i{width:10px;height:10px;border-radius:50%;flex:none}.lg span{flex:1}.lg b{font-weight:600;white-space:nowrap}.lg small{color:var(--mu);font-weight:400}
.lgd{display:flex;gap:14px;font-size:13px;color:var(--mu);margin-bottom:8px}
.lgd i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:5px}
.bars{display:flex;overflow-x:auto;gap:2px;padding-bottom:4px}
.col{flex:1 0 34px;display:flex;flex-direction:column;align-items:center;border-radius:8px;padding:4px 0}
.col.sel{background:var(--fill)}
.pair{height:150px;display:flex;align-items:flex-end;gap:3px}.pair i{display:block;width:9px;border-radius:5px 5px 0 0}
.bi{background:var(--in)}.bo{background:var(--out)}
.col small{font-size:11px;color:var(--mu);text-align:center;min-height:14px;line-height:1.3}
.bd{margin-top:10px;text-align:center;color:var(--mu);font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(40,40,42,.92);color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;z-index:50;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
.rt{color:var(--tx);margin:0 0 4px}.note small{display:block;color:var(--mu);font-size:12px;margin-top:2px}

<script>
const $=s=>document.querySelector(s),K='hesab_v1';
const DC={out:[['🍽️','Food'],['🚗','Transport'],['🧾','Bills'],['🛍️','Shopping'],['💊','Health'],['🎬','Fun'],['📚','Study'],['📦','Other']],in:[['💼','Salary'],['💰','Side income'],['🎁','Gift'],['📦','Other']]};
const IK=[['🥇','Gold'],['💵','Dollar'],['🪙','Coin'],['₿','Crypto'],['📈','Stocks'],['🏠','Property'],['📦','Other']];
const MN=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const WD=['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
const PAL=['#0f766e','#ff9f0a','#0a84ff','#bf5af2','#ff375f','#30b0c7','#ffd60a','#8e8e93','#64d2ff','#a2845e'];
let S={tx:[],inv:[],plan:[],rates:null,carry:true,lastBackup:null};
try{S=Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
if(!Array.isArray(S.tx))S.tx=[];if(!Array.isArray(S.inv))S.inv=[];if(!Array.isArray(S.plan))S.plan=[];
if(!S.cats||!S.cats.out||!S.cats.in)S.cats=JSON.parse(JSON.stringify(DC));
const CATS={get out(){return S.cats.out},get in(){return S.cats.in}};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Not saved')}};
const nz=s=>String(s).replace(/[\u200c\s]/g,'').replace(/ي/g,'ی').replace(/ك/g,'ک');
const TR={'خوراک':'Food','حملونقل':'Transport','قبض':'Bills','خرید':'Shopping','سلامت':'Health','تفریح':'Fun','آموزش':'Study','سایر':'Other','حقوق':'Salary','درآمدجانبی':'Side income','هدیه':'Gift','طلا':'Gold','دلار':'Dollar','سکه':'Coin','ارزدیجیتال':'Crypto','سهام':'Stocks','ملک':'Property'};
const mig=()=>{const T=n=>TR[nz(n)]||n;['out','in'].forEach(k=>S.cats[k]=S.cats[k].map(([i,n])=>[i,T(n)]));[S.tx,S.plan].forEach(L=>L.forEach(t=>t.cat=T(t.cat)));S.inv.forEach(x=>x.kind=T(x.kind))};
if(!S.v){mig();S.v=3;save()}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const fa=n=>Math.round(n).toLocaleString('en-US');
const pd=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const dig=s=>String(s).replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c)).replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/\D/g,'');
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
//DATE-START
const div=(a,b)=>~~(a/b),mod=(a,b)=>a-~~(a/b)*b;
function jalCal(jy){
 var br=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178],
 bl=br.length,gy=jy+621,leapJ=-14,jp=br[0],jm,jump,leap,leapG,march,n,i;
 if(jy<jp||jy>=br[bl-1])throw new Error('year');
 for(i=1;i<bl;i++){jm=br[i];jump=jm-jp;if(jy<jm)break;leapJ=leapJ+div(jump,33)*8+div(mod(jump,33),4);jp=jm}
 n=jy-jp;
 leapJ=leapJ+div(n,33)*8+div(mod(n,33)+3,4);
 if(mod(jump,33)===4&&jump-n===4)leapJ+=1;
 leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150;
 march=20+leapJ-leapG;
 if(jump-n<6)n=n-jump+div(jump+4,33)*33;
 leap=mod(mod(n+1,33)-1,4);
 if(leap===-1)leap=4;
 return{leap:leap,gy:gy,march:march}}
function g2d(gy,gm,gd){
 var d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408;
 return d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752}
function d2g(jdn){
 var j=4*jdn+139361631;
 j=j+div(div(4*jdn+183187720,146097)*3,4)*4-3908;
 var i=div(mod(j,1461),4)*5+308,gd=div(mod(i,153),5)+1,gm=mod(div(i,153),12)+1,gy=div(j,1461)-100100+div(8-gm,6);
 return{gy:gy,gm:gm,gd:gd}}
function j2d(jy,jm,jd){var r=jalCal(jy);return g2d(r.gy,3,r.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1}
function d2j(jdn){
 var gy=d2g(jdn).gy,jy=gy-621,r=jalCal(jy),f=g2d(gy,3,r.march),jd,jm,k=jdn-f;
 if(k>=0){if(k<=185){return{jy:jy,jm:1+div(k,31),jd:mod(k,31)+1}}k-=186}
 else{jy-=1;k+=179;if(r.leap===1)k+=1}
 return{jy:jy,jm:7+div(k,30),jd:mod(k,30)+1}}
const J=iso=>{const p=iso.split('-').map(Number),r=d2j(g2d(p[0],p[1],p[2]));return{y:r.jy,m:r.jm,d:r.jd}};
const G=(y,m,d)=>{const g=d2g(j2d(y,m,d));return g.gy+'-'+String(g.gm).padStart(2,'0')+'-'+String(g.gd).padStart(2,'0')};
const ML=(y,m)=>m<=6?31:m<=11?30:(jalCal(y).leap===0?30:29);
const addD=(iso,n)=>{const d=new Date(iso+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const diff=(a,b)=>Math.round((Date.parse(b+'T12:00:00Z')-Date.parse(a+'T12:00:00Z'))/864e5);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
//DATE-END
const wdn=iso=>WD[new Date(iso+'T12:00:00Z').getUTCDay()];
const jt=iso=>{const j=J(iso);return pd(j.d)+' '+MN[j.m-1]+(j.y!==J(today()).y?' '+pd(j.y):'')};
const jfull=iso=>{const j=J(iso);return pd(j.d)+' '+MN[j.m-1]+' '+pd(j.y)};
let cur=(()=>{const j=J(today());return{y:j.y,m:j.m}})(),tab='home',F=null,I=null;
let R={m:'month',type:'out',from:today(),to:today()},BK=[];
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}

function pie(items){
 const tot=items.reduce((s,x)=>s+x.v,0);if(!tot)return '';
 const r=42,C=2*Math.PI*r;let off=0;
 const arcs=items.map((x,i)=>{const l=x.v/tot*C,s=`<circle r="${r}" cx="60" cy="60" fill="none" stroke="${PAL[i%PAL.length]}" stroke-width="22" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;off+=l;return s}).join('');
 return `<div class="pie"><svg viewBox="0 0 120 120" role="img">${arcs}</svg><div class="lg">${items.map((x,i)=>`<div><i style="background:${PAL[i%PAL.length]}"></i><span>${x.ic||''} ${esc(x.n)}</span><b>${fa(x.v)} <small>(${Math.round(x.v/tot*100)}%)</small></b></div>`).join('')}</div></div>`}
const group=(a,fn)=>{const g={};a.forEach(t=>{const k=t.cat||t.kind;g[k]=(g[k]||0)+fn(t)});return Object.entries(g).filter(e=>e[1]>0).sort((x,y)=>y[1]-x[1])};

const PR=[['today','Today'],['w','7 days'],['month','Month'],['pm','Last month'],['q','90 days'],['y','Year'],['c','Custom']];
function rng(){
 const t=today(),j=J(t);let f,e;
 switch(R.m){
  case'today':f=e=t;break;
  case'w':f=addD(t,-6);e=t;break;
  case'month':f=G(j.y,j.m,1);e=G(j.y,j.m,ML(j.y,j.m));break;
  case'pm':{let y=j.y,m=j.m-1;if(m<1){m=12;y--}f=G(y,m,1);e=G(y,m,ML(y,m));break}
  case'q':f=addD(t,-89);e=t;break;
  case'y':f=G(j.y,1,1);e=G(j.y,12,ML(j.y,12));break;
  default:f=R.from;e=R.to;if(f>e){const x=f;f=e;e=x}}
 return[f,e]}

 let h=hdr()+`<div class="chips sc">${PR.map(([k,n])=>`<button class="${R.m===k?'on':''}" onclick="R.m='${k}';render()">${n}</button>`).join('')}</div>`;
 if(R.m==='c')h+=`<div class="card"><span class="lb">From</span>${dsel('rf',R.from,v=>{R.from=v;render()})}<span class="lb">To</span>${dsel('rt',R.to,v=>{R.to=v;render()})}</div>`;
 h+=`<div class="rng"><bdi>${wj(f)}</bdi>${f===e?'':` – <bdi>${wj(e)}</bdi>`}</div>
 <div class="three"><div><small>Income</small><b>${fa(inc)}</b></div><div><small>Expense</small><b>${fa(exp)}</b></div><div><small>Net</small><b class="${net<0?'out':'in'}">${net<0?'−':''}${fa(Math.abs(net))}</b></div></div>`;
 if(!a.length)return h+`<div class="empty">No data</div>`;
 h+=`<div class="seg" style="margin-top:14px"><button class="${R.type==='out'?'on':''}" onclick="R.type='out';render()">Expense</button><button class="${R.type==='in'?'on':''}" onclick="R.type='in';render()">Income</button></div>`;
 const items=group(a.filter(t=>t.type===R.type),t=>t.amount).map(([n,v])=>({n,v,ic:ico(R.type,n)}));
 h+=`<div class="card">${items.length?pie(items):'<div class="empty" style="padding:14px">No data</div>'}</div>`;
 const days=diff(f,e)+1,mon=days>45,B=[];
 if(!mon){for(let i=0;i<days;i++){const d=addD(f,i),j=J(d);B.push({k:d,l:pd(j.d),l2:(i===0||j.d===1)?MN[j.m-1]:'',t:wdn(d)+' '+jfull(d),i:0,o:0})}}
 else{const je=J(e);let j=J(f),y=j.y,m=j.m;while(y<je.y||(y===je.y&&m<=je.m)){B.push({k:y+'-'+m,l:MN[m-1],l2:'',t:MN[m-1]+' '+pd(y),i:0,o:0});m++;if(m>12){m=1;y++}}}
 const ix={};B.forEach((b,i)=>ix[b.k]=i);
 a.forEach(t=>{let k=t.date;if(mon){const j=J(t.date);k=j.y+'-'+j.m}const b=B[ix[k]];if(b)b[t.type==='in'?'i':'o']+=t.amount});
 BK=B;const mx=Math.max(1,...B.map(b=>Math.max(b.i,b.o))),H=v=>v?Math.max(3,Math.round(v/mx*150)):0;
 h+=`<h3>${mon?'Monthly':'Daily'}</h3><div class="card"><div class="lgd"><span><i style="background:var(--in)"></i>Income</span><span><i style="background:var(--out)"></i>Expense</span></div>
 <div class="bars">${B.map((b,i)=>`<div class="col" onclick="bsel(${i})"><div class="pair"><i class="bi" style="height:${H(b.i)}px"></i><i class="bo" style="height:${H(b.o)}px"></i></div><small>${b.l}</small><small>${b.l2}</small></div>`).join('')}</div>
 <div class="bd" id="bd">Tap a bar</div></div>`;
 return h}

 $('#sheet').innerHTML=`<div class="seg"><button class="${I.dir==='b'?'on':''}" onclick="I.dir='b';drawInv()">Buy</button><button class="${I.dir==='s'?'on':''}" onclick="I.dir='s';drawInv()">Sell</button></div>
 <div class="chips">${IK.map(([i,n])=>`<button class="${I.kind===n?'on':''}" onclick="I.kind='${n}';drawInv()">${i} ${n}</button>`).join('')}</div>
 ${pk?`<input class="amount" inputmode="decimal" placeholder="${I.kind==='Gold'?'Grams':'Dollars'}" value="${I.qty||''}" oninput="I.qty=dq(this.value);this.value=I.qty">`:''}
 <input${pk?'':' class="amount"'} inputmode="numeric" placeholder="${pk?'Paid in Toman (optional)':'0'}" value="${I.amount?fa(+I.amount):''}" oninput="I.amount=dig(this.value);this.value=I.amount?fa(+I.amount):''">
 ${dsel('i',I.date,v=>{I.date=v;drawInv()})}
 <input dir="auto" placeholder="Note" value="${esc(I.note)}" oninput="I.note=this.value">
 <button class="btn" onclick="saveInv()">Save</button>${I.id?`<button class="btn del" onclick="delInv()">Delete</button>`:''}`}
function saveInv(){
 const pk=RK[I.kind],qty=pk?+I.qty:0;let amount=+I.amount;
 if(pk){if(!qty)return toast('Enter '+(I.kind==='Gold'?'grams':'dollars'));if(!amount){if(!rt(I.kind))return toast('Enter paid amount');amount=Math.round(qty*rt(I.kind))}}
 else if(!amount)return toast('Enter amount');
 const x={id:I.id||Date.now(),dir:I.dir,amount,kind:I.kind,note:I.note.trim(),date:I.date};if(qty)x.qty=qty;
 const i=S.inv.findIndex(y=>y.id===x.id);i>=0?S.inv[i]=x:S.inv.push(x);save();closeForm();render();toast('Saved')}
function delInv(){if(!confirm('Delete?'))return;S.inv=S.inv.filter(x=>x.id!==I.id);save();closeForm();render()}

/* rates */
const RK={Gold:'gold',Dollar:'usd'};
const rt=k=>S.rates&&S.rates[RK[k]],sg=x=>x.dir==='s'?-1:1,val=x=>sg(x)*(x.qty&&rt(x.kind)?x.qty*rt(x.kind):x.amount);
const fq=n=>(+n).toLocaleString('en-US',{maximumFractionDigits:3}),fu=(k,q)=>k==='Dollar'?'$'+fq(q):fq(q)+' g',hm=()=>new Date().toTimeString().slice(0,5);
const dq=s=>String(s||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/٫/g,'.').replace(/[^\d.]/g,'');
const hold=()=>Object.keys(RK).map(k=>{const q=S.inv.filter(x=>x.kind===k&&x.qty).reduce((s,x)=>s+sg(x)*x.qty,0),r=rt(k);return q?`<div class="row"><span class="ic">${iic(k)}</span><span class="mid"><b>${k}</b><small>${fu(k,q)}${r?` × ${fa(r)}`:''}</small></span><span class="amt">${r?fa(q*r):'—'}</span></div>`:''}).join('');
const rateRow=()=>{const r=S.rates;return `<button class="note rt" onclick="openRates()">${r?`Gold ${r.gold?fa(r.gold):'—'} · USD ${r.usd?fa(r.usd):'—'}<small>${r.src==='manual'?'Manual':'TGJU'} · <bdi>${wj(r.d)}</bdi> ${r.h}</small>`:'Set gold & dollar rates'}</button>`};
function openRates(){const r=S.rates||{};
 $('#sheet').innerHTML=`<div class="sh">Rates</div>
 <span class="lb">Gold 18k · Toman per gram</span><input id="rg" inputmode="numeric" value="${r.gold?fa(r.gold):''}" oninput="this.value=dig(this.value)?fa(+dig(this.value)):''">
 <span class="lb">Dollar · Toman</span><input id="ru" inputmode="numeric" value="${r.usd?fa(r.usd):''}" oninput="this.value=dig(this.value)?fa(+dig(this.value)):''">
 <button class="btn" onclick="getRates(1)">Update from TGJU</button><button class="btn alt" onclick="saveRates()">Save manually</button>`;
 $('#ov').classList.add('on')}
function saveRates(){const g=+dig($('#rg').value),u=+dig($('#ru').value);if(!g&&!u)return toast('Enter a rate');
 S.rates={...S.rates,...(g&&{gold:g}),...(u&&{usd:u}),t:Date.now(),d:today(),h:hm(),src:'manual'};save();closeForm();render();toast('Saved')}
async function getRates(force){
 const r=S.rates;if(!force&&r&&Date.now()-r.t<36e5)return;
 for(const u of['https://call4.tgju.org/ajax.json','https://call3.tgju.org/ajax.json']){
  try{const c=new AbortController(),m=setTimeout(()=>c.abort(),8000),res=await fetch(u,{signal:c.signal,cache:'no-store'});clearTimeout(m);
   const j=(await res.json()).current,g=+dig(String(j.geram18.p)),d=+dig(String(j.price_dollar_rl.p));
   if(g>0&&d>0){S.rates={gold:Math.round(g/10),usd:Math.round(d/10),t:Date.now(),d:today(),h:hm(),src:'tgju'};save();if(tab==='inv')render();if(force){openRates();toast('Updated')}return}}catch(e){}}
 if(force)toast("Can't reach TGJU")}

async function backup(){
 const txt=JSON.stringify({app:'hesab',v:3,data:{tx:S.tx,inv:S.inv,plan:S.plan,cats:S.cats}}),name=`hesab-backup-${today()}.json`;
 const file=new File([txt],name,{type:'application/json'});let ok=false;
 try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Backup'});ok=true}
  else if(navigator.share){await navigator.share({title:'Backup',text:txt});ok=true}}
 catch(e){if(e.name==='AbortError')return}
 if(!ok){try{await navigator.clipboard.writeText(txt);ok=true;toast('Copied')}catch(e){toast('Failed')}}
 if(ok){S.lastBackup=today();save();render()}}
function load(txt){try{const j=JSON.parse(txt),d=j.data||j;if(!Array.isArray(d.tx))throw 0;
 if(!confirm('Replace current data?'))return;S.tx=d.tx;if(Array.isArray(d.inv))S.inv=d.inv;if(Array.isArray(d.plan))S.plan=d.plan;if(d.cats&&d.cats.out&&d.cats.in)S.cats=d.cats;mig();save();render();toast('Restored')}catch(e){toast('Invalid file')}}
const restoreFile=f=>{if(!f)return;const r=new FileReader();r.onload=()=>load(r.result);r.readAsText(f)};
function wipe(){if(confirm('Erase all data?')&&confirm('Sure? Back up first.')){S.tx=[];S.inv=[];S.plan=[];save();render()}}
if('serviceWorker' in navigator)try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();banner();getRates()}});
render();banner();getRates();
</script>
</body>
